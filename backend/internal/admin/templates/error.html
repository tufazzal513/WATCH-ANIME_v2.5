{{define "content"}}
<div class="fade-in bg-gray-800 rounded-xl p-8 text-center max-w-md mx-auto mt-10">
    <i class="fas fa-triangle-exclamation text-4xl text-blue-500 mb-4"></i>
    <h2 class="text-xl font-bold text-white mb-2">{{.Title}}</h2>
    <p class="text-gray-400 text-sm mb-6">{{.Data}}</p>
    <a href="/admin/" class="inline-block bg-blue-600 hover:bg-blue-700 rounded-lg px-5 py-2 text-sm font-semibold transition-colors">Back to dashboard</a>
</div>
{{end}}
